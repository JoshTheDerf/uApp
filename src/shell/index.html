<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} — uapp</title>
<link rel="stylesheet" href="./shell.css">
<link rel="icon" href="./icon-256.png">
</head>
<body>
<!-- The shell is a set of Web Components; each bundles its template, style
     and behavior in src/shell/js/<name>.js. shell.css carries the design
     tokens and shared primitives (buttons, dialogs, menus, panels). -->
<shell-topbar id="topbar"></shell-topbar>

<main id="main">
  <!-- allow= is the Permissions-Policy delegation, not a grant: it only lets
       the app's navigator.* call reach the webview, which then goes through the
       native Allow/Deny prompt (see permissions.rs). Same-origin frames inherit
       these by default; naming them keeps that true if /app/ ever moves to its
       own origin. Notifications have no Permissions-Policy token, so they are
       gated solely by the native prompt. -->
  <iframe id="appframe" src="/app/"
          allow="camera; microphone; display-capture; geolocation; clipboard-read; storage-access"></iframe>
  <!-- Hidden eval context for the AI's run_js tool: uapp.js only, no app code.
       Starts EMPTY and is loaded on first use (the server asks for it when a
       run_js call needs the scratchpad — see main.js): a permanently loaded
       second document is memory nobody is looking at, which on a phone webview
       comes out of the same budget as the app's own GPU/JS allocations. Once
       loaded it is never reloaded, so scratch state survives across calls. -->
  <iframe id="scratchframe" style="display:none" title="scratchpad"></iframe>

  <!-- Overlay panels: the topbar button toggles, X / Esc closes, opening one
       closes the others (they slide in/out; open state = .open). -->
  <chat-panel id="sidebar" class="overlay-panel"></chat-panel>
  <sql-panel id="sqlpanel" class="overlay-panel"></sql-panel>
  <files-panel id="filebrowser" class="overlay-panel"></files-panel>
  <settings-panel id="settingspanel" class="overlay-panel"></settings-panel>
  <tools-panel id="toolspanel" class="overlay-panel"></tools-panel>
</main>

<file-viewer></file-viewer>

<script src="./icons.js"></script>
<script type="module" src="./shell/main.js"></script>
</body>
</html>
