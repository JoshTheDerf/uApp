[package]
name = "uapp"
version = "0.2.5"
edition = "2021"
description = "Single-file shareable apps: app + data + AI in one .uapp file"
license = "MIT"
repository = "https://github.com/JoshTheDerf/uApp"
default-run = "uapp"

# The core library both binaries share. `staticlib`/`cdylib` are required by
# `cargo tauri android/ios build` (the mobile entry points are linked as
# static/dynamic libs.
[lib]
name = "uapp"
crate-type = ["staticlib", "cdylib", "rlib"]

# The native UApp desktop window (Tauri) — the primary distributed binary.
# Enabled by default (gui feature is default).
[[bin]]
name = "uapp"
path = "src/desktop.rs"
required-features = ["gui"]

# Server binary for future work — not distributed, not documented.
# Built explicitly with `--bin uapp-server --no-default-features`.
[[bin]]
name = "uapp-server"
path = "src/main.rs"

# Demo apps builder — builds example .uapp files and the launcher.
# Run with: cargo run --bin make-demo-apps -- <launcher-out-dir> [examples-dir]
[[bin]]
name = "make-demo-apps"
path = "src/bin/make-demo-apps.rs"

[features]
default = ["gui"]
# Native desktop/mobile shell (Tauri v2 + a system webview). Enabled by default.
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
base64 = "0.22"
flate2 = "1"
anyhow = "1"
fastrand = "2"

# Everything OS-facing (server, files, processes, TLS) is native-only; the
# wasm32 browser build swaps in the block below instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", optional = true , features = [] }
# Native "Save…" file dialog for scratch apps (gui feature only).
tauri-plugin-dialog = { version = "2", optional = true }
# bundled-sqlcipher: SQLite compiled WITH SQLCipher, so `PRAGMA key/rekey`
# actually encrypt (plain `bundled` silently ignores them).
# bundled-sqlcipher-vendored-openssl: SQLite+SQLCipher AND a vendored OpenSSL
# built from source, so encryption links statically with no system OpenSSL —
# self-contained on Linux, macOS, and Windows (the plain -sqlcipher feature
# needs OPENSSL_DIR, which Windows CI runners don't have). Needs Perl at build
# time (and NASM on Windows) — see the workflows.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "backup", "functions"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
ureq = { version = "2", features = ["tls", "json"] }
whoami = "1"
open = "5"
fs2 = "0.4"
futures-util = "0.3"
dirs = "5"
# Hidden master-password prompts in the CLI (no-tty falls back to flags/env).
rpassword = "7"

# The browser (WASM) build: SQLite compiled to wasm (rusqlite's own
# sqlite-wasm-rs backend), wasm-bindgen for the JS boundary. No SQLCipher —
# encrypted .uapp files are refused in the browser demo.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["ffi-sqlite-wasm-rs", "backup", "functions", "serialize"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
fastrand = { version = "2", features = ["js"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
